# CLI config (used if deploying with `supabase functions deploy`)
project_id = "rkslrbcbncecekghwbap"

[auth]
# Frictionless onboarding: first launch mints an anonymous user. The HOSTED
# project must also enable this in the dashboard (Auth > Sign In / Providers >
# Anonymous sign-ins) — this block only affects `supabase start` / local dev.
enable_anonymous_sign_ins = true

[functions.generate-entry]
# Auth is enforced inside the function (service key or user JWT) because the
# new sb_secret_* keys are not JWTs and cron/pg_net calls would fail verify_jwt.
verify_jwt = false

[functions.synthesize]
# Same reasoning as generate-entry: auth checked inside the function.
verify_jwt = false

[functions.rc-webhook]
# Called by RevenueCat, which has no Supabase JWT. Auth is the shared
# Authorization header configured in the RevenueCat dashboard, compared
# against the RC_WEBHOOK_SECRET function secret inside the function.
verify_jwt = false

[functions.delete-account]
# Auth checked inside the function, which deliberately accepts ONLY a real
# end-user JWT (service keys are rejected). Left off for consistency with the
# other functions; the in-function check is the actual gate.
verify_jwt = false
